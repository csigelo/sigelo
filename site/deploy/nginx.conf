# site/deploy/nginx.conf — sigelo.io on nginx. SPDX-License-Identifier: MIT
#
# Installed as /etc/nginx/conf.d/sigelo.io.conf (Debian/Ubuntu) or /etc/nginx/http.d/sigelo.io.conf
# (Alpine), inside the distribution's http {} block, by /usr/local/sbin/sigelo-nginx-apply (see
# sigelo-nginx-apply in this directory): deploy.sh uploads this file and runs that helper through
# sudo; server-setup.sh runs it once by hand. Nothing else edits the installed copy — certbot
# obtains the certificate with `certbot certonly --nginx` and never rewrites this file.
#
# Needs nginx >= 1.19.4 (ssl_reject_handshake): Debian 12 ships 1.22, Ubuntu 24.04 1.24, Alpine
# 3.20 1.26. HTTP/2 is switched on in the `listen` lines, the only form 1.22 knows (nginx >= 1.25.1
# accepts it with a deprecation warning, not an error). Written to the nginx documentation; NOT
# run through `nginx -t` on the authoring host (it has no nginx). The helper runs `nginx -t` before every reload and restores the previous
# file if the test fails.
#
# House style, enforced by the helper's allowlist: one statement per line, comments on their own
# lines, no `include`, no `alias`, fixed paths for root, logs and certificates.
#
# What it does, and why it matches site/test/run.mjs exactly:
#   * Content types: its own complete `types` block (it does not include mime.types, whose `md`,
#     `mjs` and `js` entries differ between distributions) plus `charset utf-8` for the text
#     types, so responses are byte-for-byte the test server's:
#       .html text/html; charset=utf-8        .md   text/markdown; charset=utf-8
#       .txt  text/plain; charset=utf-8       .css  text/css; charset=utf-8
#       .mjs  text/javascript; charset=utf-8  .json application/json
#       .xml  application/xml                 .yaml application/yaml
#     (json, xml and yaml are deliberately NOT in charset_types: the test server sends them bare.)
#   * Markdown negotiation: `Accept: text/markdown` on /, /<page>.html or /<page> serves the .md
#     twin. Without it, /<page> serves /<page>.html.
#   * Headers: every header is set at server level and no location sets its own, because one
#     add_header inside a location silently drops all the inherited ones. Cache-Control comes
#     from a map so it needs no per-location add_header: /sha256/* (content-addressed) a year,
#     immutable; everything else an hour.
#   * HSTS starts at max-age=300 (five minutes) so a TLS mistake on the first deploy cannot lock
#     visitors out for a year. Once `node site/deploy/check.mjs` has passed against the live
#     site, change BOTH Strict-Transport-Security lines to max-age=31536000 and redeploy (no
#     includeSubDomains, no preload: those bind every future subdomain, the Owner's decision).
#   * Privacy: the access log records no client address (the first field is a literal "-") and
#     no referrer; it keeps time, request, status, size and user agent (which agents and
#     crawlers read the site is the one figure worth having). The error log is at `crit`, because
#     nginx writes the client address into every error-level line. Both live in
#     /var/log/nginx/sigelo/ and are rotated daily, 7 kept (/etc/logrotate.d/sigelo, written by
#     server-setup.sh). Requests to anything but sigelo.io/www are dropped and not logged.

# ---- maps and the log format (http context) ---------------------------------------------------
map $http_accept $sigelo_md {
    default 0;
    "~*text/markdown" 1;
}

map $uri $sigelo_cache {
    default "public, max-age=3600";
    "~^/sha256/" "public, max-age=31536000, immutable";
}

log_format sigelo_noip '- - [$time_local] "$request" $status $body_bytes_sent "-" "$http_user_agent"';

# server_tokens is set per server, not here: Alpine's stock nginx.conf already sets it in http {},
# and the same directive twice in one context fails `nginx -t`. The same goes for every ssl_*
# directive below, which the distributions also set in http {} (server level overrides them).

# ---- anything that is not sigelo.io: dropped, unlogged ----------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_reject_handshake on;
    # The protocol is negotiated before SNI picks a server, so the default server's list is the
    # one that counts: without these lines Debian's http-level "TLSv1 TLSv1.1 ..." would apply.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
}

# ---- port 80: ACME challenges, everything else to https://sigelo.io ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sigelo.io www.sigelo.io sigelo.net www.sigelo.net;
    server_tokens off;
    access_log /var/log/nginx/sigelo/access.log sigelo_noip;
    error_log /var/log/nginx/sigelo/error.log crit;

    # certbot's nginx authenticator adds an exact-match location here during issuance and
    # renewal; /var/www/acme also allows `certbot renew --webroot -w /var/www/acme` as a fallback.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://sigelo.io$request_uri;
    }
}

# ---- www.sigelo.io and sigelo.net (apex and www) over TLS: 301 to the apex ---------------------
# One certificate lineage (/etc/letsencrypt/live/sigelo.io) carries all four names.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sigelo.io sigelo.net www.sigelo.net;
    server_tokens off;
    access_log /var/log/nginx/sigelo/access.log sigelo_noip;
    error_log /var/log/nginx/sigelo/error.log crit;

    ssl_certificate /etc/letsencrypt/live/sigelo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigelo.io/privkey.pem;
    # Mozilla "intermediate": TLS 1.2 and 1.3, AEAD ciphers with forward secrecy only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sigelo_tls:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=300" always;
    return 301 https://sigelo.io$request_uri;
}

# ---- sigelo.io: the site -----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sigelo.io;
    server_tokens off;
    root /var/www/sigelo.io/dist;
    index index.html;
    access_log /var/log/nginx/sigelo/access.log sigelo_noip;
    error_log /var/log/nginx/sigelo/error.log crit;
    log_not_found off;

    ssl_certificate /etc/letsencrypt/live/sigelo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigelo.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sigelo_tls:10m;
    ssl_session_tickets off;

    # Exactly the extensions site/dist contains; anything else is application/octet-stream.
    types {
        text/html html;
        text/markdown md;
        text/plain txt;
        text/css css;
        text/javascript mjs;
        application/json json;
        application/xml xml;
        application/yaml yaml;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/html text/markdown text/plain text/css text/javascript;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/markdown text/plain text/css text/javascript application/json application/xml application/yaml;

    # The README's headers (site/README.md, "Deploying"): no scripts run anywhere on the site, so
    # default-src 'self' costs nothing; the JSON-LD blocks are data, not script.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Vary "Accept" always;
    add_header Cache-Control $sigelo_cache always;
    add_header Strict-Transport-Security "max-age=300" always;

    # Dotfiles (.nojekyll, written for GitHub Pages) are not served; /.well-known/ is.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = / {
        if ($sigelo_md) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location ~ ^/[\w-]+\.html$ {
        if ($sigelo_md) {
            rewrite ^/([\w-]+)\.html$ /$1.md last;
        }
        try_files $uri =404;
    }

    # /spec works as well as /spec.html (and negotiates the same way).
    location ~ ^/[\w-]+$ {
        if ($sigelo_md) {
            rewrite ^/([\w-]+)$ /$1.md last;
        }
        try_files $uri $uri.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
