# site/deploy/nginx.conf — sigelo.io on nginx. SPDX-License-Identifier: MIT
#
# Installed as /etc/nginx/conf.d/sigelo.io.conf (Debian/Ubuntu) or /etc/nginx/http.d/sigelo.io.conf
# (Alpine), inside the distribution's http {} block, by /usr/local/sbin/sigelo-nginx-apply (see
# sigelo-nginx-apply in this directory): deploy.sh uploads this file and runs that helper through
# sudo; server-setup.sh runs it once by hand. Nothing else edits the installed copy — certbot
# obtains the certificate with `certbot certonly --nginx` and never rewrites this file.
#
# Needs nginx >= 1.19.4 (ssl_reject_handshake): Debian 12 ships 1.22, Ubuntu 24.04 1.24, Alpine
# 3.20 1.26. HTTP/2 is switched on in the `listen` lines, the only form 1.22 knows (nginx >= 1.25.1
# accepts it with a deprecation warning, not an error). Written to the nginx documentation; NOT
# run through `nginx -t` on the authoring host (it has no nginx). The helper runs `nginx -t` before every reload and restores the previous
# file if the test fails.
#
# House style, enforced by the helper's allowlist: one statement per line, comments on their own
# lines, no `include`, no `alias`, fixed paths for root, logs and certificates.
#
# What it does, and why it matches site/test/run.mjs exactly:
#   * Content types: its own complete `types` block (it does not include mime.types, whose `md`,
#     `mjs` and `js` entries differ between distributions) plus `charset utf-8` for the text
#     types, so responses are byte-for-byte the test server's:
#       .html text/html; charset=utf-8        .md   text/markdown; charset=utf-8
#       .txt  text/plain; charset=utf-8       .css  text/css; charset=utf-8
#       .mjs  text/javascript; charset=utf-8  .json application/json
#       .xml  application/xml                 .yaml application/yaml
#     (json, xml and yaml are deliberately NOT in charset_types: the test server sends them bare.)
#   * Markdown negotiation: `Accept: text/markdown` on /, /<page>.html or /<page> serves the .md
#     twin. Without it, /<page> serves /<page>.html.
#   * Headers: every header is set at server level and no location sets its own, because one
#     add_header inside a location silently drops all the inherited ones. Cache-Control comes
#     from a map so it needs no per-location add_header: /sha256/* (content-addressed) a year,
#     immutable; everything else an hour. ETag and Last-Modified are nginx's defaults for static
#     files (weak ETags once gzipped), so conditional requests work without a directive. Link
#     (from a map) points each page at its Markdown twin and each twin at its canonical page.
#   * HSTS starts at max-age=300 (five minutes) so a TLS mistake on the first deploy cannot lock
#     visitors out for a year. Once `node site/deploy/check.mjs` has passed against the live
#     site, change EVERY Strict-Transport-Security line to max-age=31536000 and redeploy (no
#     includeSubDomains, no preload: those bind every future subdomain, the Owner's decision).
#   * Privacy: no raw client address is logged. The access log's first field is the address cut
#     to its network ($sigelo_net: IPv4 /24 -> a.b.c.0, IPv6 /48 -> a:b:c::), a coarse pseudonym
#     shared by everyone on that network, enough for GoAccess to estimate unique visitors and no
#     more; the referrer is cut to scheme and host; the path is logged without its query string.
#     It keeps time, method, path, status, size, user agent and Accept (what tells an agent from a
#     browser: agents never run scripts, so these logs are the only place they show up), and the
#     request time. The error log is at `crit`, because nginx writes the full client address into
#     every error-level line. Both live in /var/log/nginx/sigelo/ and are rotated daily, 30 kept
#     (/etc/logrotate.d/sigelo, written by server-setup.sh). Requests to anything but sigelo.io,
#     .net, .org, .online, .dev, .ai (apex and www) are dropped and not logged, and so are requests
#     for /_stats/.
#   * The project's own requests (check.mjs, watch.sh, indexnow.sh's key fetch, mirror-release.sh,
#     the server's sigelo-selfcheck) send User-Agent "sigelo-selfcheck/1 (+https://sigelo.io/privacy)".
#     They go to access-self.log (same format, 7 days kept) instead of access.log, so the
#     statistics count outsiders only and an outage stays debuggable. Anyone can send that user
#     agent and leave the statistics: they lose nothing but a count.
#   * /_stats/: the GoAccess report and agents.txt that server-setup.sh --stats regenerates every
#     15 minutes into /var/www/sigelo.io/stats, behind HTTP basic auth, noindex, no-store, with a
#     CSP that lets the report's own inline script run (it loads nothing from anywhere). The
#     header values come from maps keyed on $request_uri, so no location sets its own add_header.

# ---- maps and the log format (http context) ---------------------------------------------------
map $http_accept $sigelo_md {
    default 0;
    "~*text/markdown" 1;
}

# Keyed on $request_uri, not $uri: /_stats/ rewrites $uri to the file it serves. The status is
# part of the key so that only a found /sha256/ file (200, or 304 on revalidation) is immutable: a
# 404 there must not be cached for a year.
map "$status $request_uri" $sigelo_cache {
    default "public, max-age=3600";
    "~^\d+ /_stats(/|$)" "no-store";
    "~^(200|304) /sha256/" "public, max-age=31536000, immutable";
    "~^(200|304) /releases/v[^/?]+/(?!index\.md)[^/?]+$" "public, max-age=31536000, immutable";
    "~^\d+ /releases(/|$)" "public, max-age=300";
    "~^\d+ /world/(genesis|rotations)\.json" "public, max-age=300";
    "~^\d+ /world/" "no-store";
    "~^\d+ /mcp(\?|$)" "no-store";
}

# Link (RFC 8288), keyed on $uri after try_files/rewrite picked the file: an HTML page names its
# Markdown twin, a twin names its HTML page as canonical (Google reads rel=canonical in a Link
# header for non-HTML files), so agents that read headers only find the twin and search engines
# do not index the twin as a duplicate. Root-level .md files are exactly the page twins; /raw/
# and /sha256/ copies get no header.
map $uri $sigelo_link {
    default "";
    "/index.html" '</index.md>; rel="alternate"; type="text/markdown"';
    "/index.md" '<https://sigelo.io/>; rel="canonical"';
    "~^/(?<sigelo_lh>[\w-]+)\.html$" '</$sigelo_lh.md>; rel="alternate"; type="text/markdown"';
    "~^/(?<sigelo_lm>[\w-]+)\.md$" '<https://sigelo.io/$sigelo_lm.html>; rel="canonical"';
}

map $request_uri $sigelo_csp {
    default "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    "~^/_stats(/|$)" "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

# An empty value sends no header at all.
map $request_uri $sigelo_robots {
    default "";
    "~^/_stats(/|$)" "noindex, nofollow, noarchive";
}

# The client address cut to its network: IPv4 /24, IPv6 /48 (the three ways the first three
# groups can be written: all present, the third zero, the second and third zero). Anything else
# (::1, a unix socket) becomes 0.0.0.0, still a valid address for GoAccess.
map $remote_addr $sigelo_net {
    default "0.0.0.0";
    "~^(?<sigelo_n4>\d+\.\d+\.\d+)\.\d+$" "$sigelo_n4.0";
    "~*^(?<sigelo_n6>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):" "$sigelo_n6::";
    "~*^(?<sigelo_n6b>[0-9a-f]+:[0-9a-f]+)::" "$sigelo_n6b::";
    "~*^(?<sigelo_n6c>[0-9a-f]+)::" "$sigelo_n6c::";
}

# The referrer cut to scheme and host; the path without its query string.
map $http_referer $sigelo_ref {
    default "-";
    "~*^(?<sigelo_rs>https?)://(?<sigelo_rh>[^/:?#]+)" "$sigelo_rs://$sigelo_rh/";
}

map $request_uri $sigelo_path {
    default "-";
    "~^(?<sigelo_p>/[^?]*)" "$sigelo_p";
}

# The project's own traffic (the user agent above): $sigelo_self picks access-self.log,
# $sigelo_outside access.log; `access_log ... if=` logs when the value is neither "" nor "0".
map $http_user_agent $sigelo_self {
    default 0;
    "~^sigelo-selfcheck/" 1;
}

map $http_user_agent $sigelo_outside {
    default 1;
    "~^sigelo-selfcheck/" 0;
}

# GoAccess reads this as:  %h %^ %^ [%d:%t %^] "%m %U %H" %s %b "%R" "%u" "%^" %T
log_format sigelo_anon '$sigelo_net - - [$time_local] "$request_method $sigelo_path $server_protocol" $status $body_bytes_sent "$sigelo_ref" "$http_user_agent" "$http_accept" $request_time';

# The world (world/server.mjs): 60 requests a minute per truncated address ($sigelo_net, the
# same /24 or /48 the log keeps), so the limit needs no raw address either.
limit_req_zone $sigelo_net zone=sigelo_world:1m rate=60r/m;

# server_tokens is set per server, not here: Alpine's stock nginx.conf already sets it in http {},
# and the same directive twice in one context fails `nginx -t`. The same goes for every ssl_*
# directive below, which the distributions also set in http {} (server level overrides them).

# ---- anything that is not sigelo.io: dropped, unlogged ----------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_reject_handshake on;
    # The protocol is negotiated before SNI picks a server, so the default server's list is the
    # one that counts: without these lines Debian's http-level "TLSv1 TLSv1.1 ..." would apply.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
}

# ---- port 80: ACME challenges, everything else to https://sigelo.io ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sigelo.io www.sigelo.io sigelo.net www.sigelo.net;
    server_tokens off;
    access_log /var/log/nginx/sigelo/access.log sigelo_anon if=$sigelo_outside;
    access_log /var/log/nginx/sigelo/access-self.log sigelo_anon if=$sigelo_self;
    error_log /var/log/nginx/sigelo/error.log crit;

    # certbot's nginx authenticator adds an exact-match location here during issuance and
    # renewal; /var/www/acme also allows `certbot renew --webroot -w /var/www/acme` as a fallback.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://sigelo.io$request_uri;
    }
}

# ---- www.sigelo.io and sigelo.net (apex and www) over TLS: 301 to the apex ---------------------
# One certificate lineage (/etc/letsencrypt/live/sigelo.io) carries all four names.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sigelo.io sigelo.net www.sigelo.net;
    server_tokens off;
    access_log /var/log/nginx/sigelo/access.log sigelo_anon if=$sigelo_outside;
    access_log /var/log/nginx/sigelo/access-self.log sigelo_anon if=$sigelo_self;
    error_log /var/log/nginx/sigelo/error.log crit;

    ssl_certificate /etc/letsencrypt/live/sigelo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigelo.io/privkey.pem;
    # Mozilla "intermediate": TLS 1.2 and 1.3, AEAD ciphers with forward secrecy only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sigelo_tls:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=300" always;
    return 301 https://sigelo.io$request_uri;
}

# ---- sigelo.org, sigelo.online, sigelo.dev, sigelo.ai: redirect-only, like sigelo.net ----------
# One group (port 80 + TLS) per domain, so one can later get its own role by editing its group
# alone. Their names join the sigelo.io certificate lineage as their DNS starts pointing here
# (server-setup.sh --certs skips a name that does not resolve to this host yet); until then nginx
# serves them the sigelo.io certificate and TLS clients refuse it, which is harmless. A domain
# split out later onto its own lineage needs the helper's ssl_certificate rule widened first.
# sigelo.dev is on the HSTS preload list (browsers never use http:// there); port 80 still
# answers the ACME HTTP-01 challenge.

server {
    listen 80;
    listen [::]:80;
    server_name sigelo.org www.sigelo.org;
    server_tokens off;
    access_log /var/log/nginx/sigelo/access.log sigelo_anon if=$sigelo_outside;
