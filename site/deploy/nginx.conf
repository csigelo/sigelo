# ---- sigelo.io: the site -----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sigelo.io;
    server_tokens off;
    root /var/www/sigelo.io/dist;
    index index.html;
    access_log /var/log/nginx/sigelo/access.log sigelo_anon if=$sigelo_outside;
    access_log /var/log/nginx/sigelo/access-self.log sigelo_anon if=$sigelo_self;
    error_log /var/log/nginx/sigelo/error.log crit;
    log_not_found off;

    ssl_certificate /etc/letsencrypt/live/sigelo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigelo.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:sigelo_tls:10m;
    ssl_session_tickets off;

    # Exactly the extensions site/dist contains; anything else is application/octet-stream.
    types {
        text/html html;
        text/markdown md;
        text/plain txt;
        text/css css;
        text/javascript mjs;
        application/json json;
        application/xml xml;
        application/yaml yaml;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/html text/markdown text/plain text/css text/javascript;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/markdown text/plain text/css text/javascript application/json application/xml application/yaml;

    # The README's headers (site/README.md, "Deploying"): no scripts run anywhere on the site, so
    # default-src 'self' costs nothing; the JSON-LD blocks are data, not script.
    add_header Content-Security-Policy $sigelo_csp always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Vary "Accept" always;
    add_header Cache-Control $sigelo_cache always;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Robots-Tag $sigelo_robots always;
    add_header Link $sigelo_link;

    # Dotfiles (.nojekyll, written for GitHub Pages) are not served; /.well-known/ is.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = / {
        if ($sigelo_md) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location ~ ^/[\w-]+\.html$ {
        if ($sigelo_md) {
            rewrite ^/([\w-]+)\.html$ /$1.md last;
        }
        try_files $uri =404;
    }

    # /spec works as well as /spec.html (and negotiates the same way).
    location ~ ^/[\w-]+$ {
        if ($sigelo_md) {
            rewrite ^/([\w-]+)$ /$1.md last;
        }
        try_files $uri $uri.html =404;
    }

    # The visit statistics (server-setup.sh --stats): basic auth, not logged, not cached, noindex.
    location = /_stats {
        return 301 /_stats/;
    }

    location ^~ /_stats/ {
        access_log off;
        auth_basic "sigelo.io stats";
        auth_basic_user_file /etc/nginx/sigelo-stats.htpasswd;
        root /var/www/sigelo.io/stats;
        rewrite ^/_stats/$ /index.html break;
        rewrite ^/_stats/(.+)$ /$1 break;
        try_files $uri =404;
    }

    # The world (world/README.md): loopback node service, sigelo-world.service. nginx passes no
    # client address (no X-Forwarded-For, no X-Real-IP): the service never sees one. Its genesis
    # and rotation chain are static files in dist/world/, served even when the service is down.
    location = /world {
        return 301 /world/;
    }

    location = /world/genesis.json {
        try_files $uri =404;
    }

    location = /world/rotations.json {
        try_files $uri =404;
    }

    location ^~ /world/ {
        limit_req zone=sigelo_world burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8790;
    }

    # Remote MCP (world/mcp.mjs): the same service, rate limit and body limit as /world/. An exact
    # match, so the extensionless-page location above never sees /mcp.
    location = /mcp {
        limit_req zone=sigelo_world burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8790;
    }

    # The release mirror (site/deploy/mirror-release.sh): /var/www/sigelo.io/releases/<tag>/, kept
    # outside dist/ so no deploy deletes it, and reached through the symlink dist/releases ->
    # ../releases that deploy.sh puts into every upload (no second root: the helper allows none).
    # A tag's files never change once mirrored (the script refuses), so they are immutable for a
    # year; /releases/index.json, the index.md listings and /releases/latest/ five minutes (the map
    # above). Types: .tgz and .tar.gz application/gzip, SHA256SUMS text/plain, binaries and .exe
    # application/octet-stream, the listings text/markdown, test-vectors.json application/json.
    location = /releases {
        return 301 /releases/;
    }

    # the SSH allowed_signers file has no extension; serve it as text, not octet-stream
    location = /.well-known/sigelo-release-signers {
        default_type text/plain;
    }

    location ^~ /releases/ {
        index index.md;
        types {
            application/gzip tgz gz;
            application/json json;
            text/markdown md;
            text/plain txt;
        }
        default_type application/octet-stream;
        location ~ /\. {
            return 404;
        }
        location ~ /SHA256SUMS$ {
            default_type text/plain;
        }
    }

    location / {
        try_files $uri =404;
    }
}
