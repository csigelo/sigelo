# site/deploy/apache.conf — sigelo.io on Apache 2.4. SPDX-License-Identifier: MIT
#
# The alternative to nginx.conf, for a host that already runs Apache. deploy.sh does NOT install
# it (its config step and sigelo-nginx-apply are nginx-only): copy it by hand, then
#   Debian/Ubuntu: a2enmod ssl rewrite headers && cp apache.conf /etc/apache2/sites-available/sigelo.io.conf
#                  && a2ensite sigelo.io && a2dissite 000-default && apachectl configtest && systemctl reload apache2
#   Alpine:        apk add apache2 apache2-ssl; LoadModule rewrite/headers in httpd.conf; copy to
#                  /etc/apache2/conf.d/sigelo.io.conf; httpd -t && rc-service apache2 reload
# and deploy with `site/deploy/deploy.sh <user@host> --no-config`. Certificate: certbot certonly
# --webroot -w /var/www/acme -d sigelo.io -d www.sigelo.io (the port-80 vhost serves the challenge).
#
# Same behaviour as nginx.conf: the exact content types of site/test/run.mjs, Accept: text/markdown
# negotiation on /, /<page>.html and /<page>, the README's headers, an hour of cache (a year,
# immutable, under /sha256/), HSTS starting at max-age=300 (raise to 31536000 after the first green
# check), http → https and www → apex 301s, logs without client addresses, rotated by
# /etc/logrotate.d/sigelo (server-setup.sh writes it for /var/log/nginx/sigelo; point it here).
# Written to the Apache documentation; NOT run through `apachectl configtest` on the authoring host.

# Global context (outside any VirtualHost): no version in the Server header or error pages.
ServerTokens Prod
ServerSignature Off

# No client address (%a/%h) anywhere: the access log keeps time, request, status, size and user agent.
LogFormat "- - %t \"%r\" %>s %b \"-\" \"%{User-Agent}i\"" sigelo_noip

<VirtualHost *:80>
    ServerName sigelo.io
    ServerAlias www.sigelo.io sigelo.net www.sigelo.net
    CustomLog /var/log/apache2/sigelo/access.log sigelo_noip
    ErrorLog /var/log/apache2/sigelo/error.log
    ErrorLogFormat "[%t] [%l] %M"
    DocumentRoot /var/www/acme
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://sigelo.io%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.sigelo.io
    ServerAlias sigelo.net www.sigelo.net
    CustomLog /var/log/apache2/sigelo/access.log sigelo_noip
    ErrorLog /var/log/apache2/sigelo/error.log
    ErrorLogFormat "[%t] [%l] %M"
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sigelo.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sigelo.io/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    Header always set Strict-Transport-Security "max-age=300"
    Redirect permanent / https://sigelo.io/
</VirtualHost>

<VirtualHost *:443>
    ServerName sigelo.io
    DocumentRoot /var/www/sigelo.io/dist
    CustomLog /var/log/apache2/sigelo/access.log sigelo_noip
    ErrorLog /var/log/apache2/sigelo/error.log
    ErrorLogFormat "[%t] [%l] %M"
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sigelo.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sigelo.io/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off

    <Directory /var/www/sigelo.io/dist>
        Options -Indexes -MultiViews -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The test server's types, exactly (AddType with the charset parameter written out).
    AddType "text/html; charset=utf-8" .html
    AddType "text/markdown; charset=utf-8" .md
    AddType "text/plain; charset=utf-8" .txt
    AddType "text/css; charset=utf-8" .css
    AddType "text/javascript; charset=utf-8" .mjs
    AddType application/json .json
    AddType application/xml .xml
    AddType application/yaml .yaml

    Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), browsing-topics=()"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always merge Vary "Accept"
    Header always set Strict-Transport-Security "max-age=300"
    Header always set Cache-Control "public, max-age=3600"
    <LocationMatch "^/sha256/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Dotfiles (.nojekyll) are not served; /.well-known/ is.
    RedirectMatch 404 "/\.(?!well-known/)"

    RewriteEngine On
    RewriteCond %{HTTP_ACCEPT} text/markdown [NC]
    RewriteRule ^/$ /index.md [L]
    RewriteCond %{HTTP_ACCEPT} text/markdown [NC]
    RewriteRule ^/([\w-]+)\.html$ /$1.md [L]
    RewriteCond %{HTTP_ACCEPT} text/markdown [NC]
    RewriteCond %{DOCUMENT_ROOT}/$1.md -f
    RewriteRule ^/([\w-]+)$ /$1.md [L]
    RewriteCond %{DOCUMENT_ROOT}/$1.html -f
    RewriteRule ^/([\w-]+)$ /$1.html [L]
</VirtualHost>
