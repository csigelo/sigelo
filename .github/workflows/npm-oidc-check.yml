# Diagnostic: ask npm's OIDC token exchange for one package and print the answer. Run by hand; never
# fails (the exchange's refusal is the finding). Why: on 2026-10-25 the trusted-publisher publish of
# v0.1.10 answered E404 then ENEEDAUTH, which hide the registry's reason; this shows the claims the
# run presents and the registry's verdict for them. No package is published.
name: npm oidc check
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'package name'
        required: true
        default: 'sigelo'
permissions:
  id-token: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PKG: ${{ inputs.package }}
        with:
          script: |
            const tok = await core.getIDToken('npm:registry.npmjs.org');
            const claims = JSON.parse(Buffer.from(tok.split('.')[1], 'base64url').toString());
            const keep = ['aud','iss','sub','repository','repository_owner','repository_visibility','workflow','workflow_ref','job_workflow_ref','environment','ref','ref_type','event_name','runner_environment'];
            for (const k of keep) core.info(`${k}: ${JSON.stringify(claims[k])}`);
            const r = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(process.env.PKG)}`, { method: 'POST', headers: { authorization: `Bearer ${tok}`, 'content-type': 'application/json', 'npm-command': 'publish', 'user-agent': 'npm/11.21.1 node/v22 linux x64 workspaces/false ci/github-actions' }, body: '{}' });
            const body = await r.text();
            core.info(`exchange status: ${r.status}`);
            core.info(`exchange body: ${body.replace(/"token":"[^"]+"/, '"token":"<redacted>"').slice(0, 800)}`);
