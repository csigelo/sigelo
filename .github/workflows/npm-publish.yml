# Publish the npm packages with npm Trusted Publishing (GitHub OIDC): no token anywhere, and
# npm attaches a provenance attestation to each version. Each package on npmjs.com names this
# repository and this file name (adoption/npm-trusted-publishing.md). Read 2026-10-06:
# https://docs.npmjs.com/trusted-publishers (npm >= 11.5.1, node >= 22.14.0, GitHub-hosted runner,
# repository.url must match) and https://docs.npmjs.com/generating-provenance-statements.
#
# The tarballs are rebuilt here by release/build.sh from the tag and published only if their
# SHA256SUMS is byte for byte the one attached to the GitHub release of that tag (the maintainer's
# build, release/RELEASE.md step 5). No release yet: wait up to 30 minutes, then fail; re-run with
# workflow_dispatch. A version already on the registry is skipped, so a re-run is harmless. When
# every package of the tag is already there (the maintainer published the release tarballs with a
# token, release/RELEASE.md step 8), the job stops green before building: nothing is left to do.
# The packages of a tag: the five, and sigelo-contact from v0.1.2 (VERSIONING §4). Each must be at
# the tag's version and every tarball must exist before the first publish, so a slip stops the job
# with nothing published rather than half a release.
name: npm publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to publish, e.g. v0.1.2'
        required: true
      mode:
        description: "publish, or check: ask npm's OIDC exchange for each package and print its verdict, publish nothing"
        required: false
        default: 'publish'
permissions:
  id-token: write
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  # mode=check: the exchange npm would do before `npm publish`, with this workflow's own claims
  # (filename npm-publish.yml), so a refusal here is the trusted-publisher entry's verdict and
  # not a filename mismatch. Prints status and body per package; never fails; publishes nothing.
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const tok = await core.getIDToken('npm:registry.npmjs.org');
            const c = JSON.parse(Buffer.from(tok.split('.')[1], 'base64url').toString());
            for (const k of ['sub','repository','workflow_ref','job_workflow_ref','environment','ref','event_name','runner_environment']) core.info(`${k}: ${JSON.stringify(c[k])}`);
            for (const p of ['sigelo','sigelo-contact','sigelo-agent','sigelo-spend','sigelo-mcp','sigelo-recovery-kit']) {
              const r = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(p)}`, { method: 'POST', headers: { authorization: `Bearer ${tok}`, 'content-type': 'application/json', 'npm-command': 'publish', 'user-agent': 'npm/11.21.1 node/v22 linux x64 workspaces/false ci/github-actions' }, body: '{}' });
              const body = (await r.text()).replace(/"token":"[^"]+"/, '"token":"<redacted>"').slice(0, 400);
              core.info(`${p}: ${r.status} ${body}`);
            }
  publish:
    # Runs on a tag push only once the repository variable NPM_TRUSTED_PUBLISHING is 'true' (the
    # trusted publisher configured on npmjs for all six packages); before that a tag push would fail
    # on E404 every release. workflow_dispatch always runs.
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'check') || (github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (tag v7)
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (tag v7)
        with:
          node-version: '22'
          package-manager-cache: false
      - name: the tag is the packages' version
        run: |
          v=$(node -p 'require("./ts/package.json").version')
          [ "$TAG" = "v$v" ] || { echo "::error title=tag/version::tag $TAG but ts/package.json is $v"; exit 1; }
          # sigelo first: the others depend on it. sigelo-contact from 0.1.2.
          pkgs="sigelo sigelo-agent sigelo-spend sigelo-mcp sigelo-recovery-kit"
          [ "$(printf '%s\n' 0.1.2 "$v" | sort -V | head -n 1)" = 0.1.2 ] && pkgs="sigelo sigelo-contact sigelo-agent sigelo-spend sigelo-mcp sigelo-recovery-kit"
          node -e '
            const dir = { sigelo: "ts", "sigelo-contact": "contact", "sigelo-agent": "adapters/moadim",
              "sigelo-spend": "spend", "sigelo-mcp": "integrations/mcp", "sigelo-recovery-kit": "kit" };
            const [v, ...names] = process.argv.slice(1);
            let bad = 0;
            for (const n of names) {
              const j = require(`./${dir[n]}/package.json`);
              if (j.name === n && j.version === v && j.private !== true) continue;
              console.log(`::error title=lockstep::${dir[n]}/package.json is ${j.name}@${j.version}${j.private === true ? " (private)" : ""}, not ${n}@${v}`);
              bad++;
            }
            process.exit(bad ? 1 : 0);' "$v" $pkgs
          echo "V=$v" >> "$GITHUB_ENV"
          echo "PKGS=$pkgs" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/a" >> "$GITHUB_ENV"
      # The public registry document, read without credentials. 200: published; 404: not yet; anything
      # else fails the curl and the job. No registry-url on setup-node: it writes an _authToken line
      # for an unset NODE_AUTH_TOKEN into .npmrc, and npm 11 then skips the OIDC exchange and PUTs
      # with an empty token (E404 on 2026-10-25, v0.1.10; actions/setup-node#1551).
      - name: anything left to publish?
        run: |
          left=
          for p in $PKGS; do
            code=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$p/$V")
            case $code in 200) ;; 404) left="$left $p" ;; *) echo "::error title=registry::$p@$V: HTTP $code"; exit 1 ;; esac
          done
          if [ -z "$left" ]; then
            echo "::notice title=nothing to publish::every package is on the registry at $V"
            echo "DONE=1" >> "$GITHUB_ENV"
          else
            echo "to publish:$left"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (tag v7)
        if: env.DONE != '1'
        with:
          go-version-file: go/go.mod   # the toolchain line; release/build.sh exports GOTOOLCHAIN from it
          cache: false
      - name: release/build.sh makes every tarball
        if: env.DONE != '1'
        run: |
          sh release/build.sh "$OUT"
          for p in $PKGS; do
            [ -f "$OUT/$p-$V.tgz" ] || { echo "::error title=no tarball::release/build.sh made no $p-$V.tgz; nothing published"; exit 1; }
          done
      - name: SHA256SUMS equals the GitHub release's
        if: env.DONE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rel"
          for i in $(seq 30); do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP/rel" --clobber 2>/dev/null && break
            [ "$i" = 30 ] && { echo "::error title=no release::no GitHub release $TAG with a SHA256SUMS after 30 minutes; nothing published. Create it (release/RELEASE.md step 5), then re-run with workflow_dispatch tag=$TAG"; exit 1; }
            echo "waiting for release $TAG ($i/30)"; sleep 60
          done
          cmp "$RUNNER_TEMP/rel/SHA256SUMS" "$OUT/SHA256SUMS" || {
            diff "$RUNNER_TEMP/rel/SHA256SUMS" "$OUT/SHA256SUMS" || true
            echo "::error title=SHA256SUMS differ::this build of $TAG is not the released one; nothing published. Only sigelo-verify lines differ: the release's go/go.mod toolchain line decides the Go version"; exit 1; }
      # trusted publishing needs npm >= 11.5.1; node 22 ships npm 10. After the build, so the build
      # runs with the same npm as conformance.yml's release-build.
      - run: npm install -g npm@11 --no-audit --no-fund && npm --version
        if: env.DONE != '1'
      - name: publish (sigelo first, the others depend on it)
        if: env.DONE != '1'
        run: |
          for p in $PKGS; do
            t="$OUT/$p-$V.tgz"
            if [ "$(npm view "$p@$V" version 2>/dev/null || true)" = "$V" ]; then
              echo "skip $p@$V: already on the registry"
            else
              npm publish "$t" --provenance --access public
            fi
            want=$(node -p '"sha512-" + require("crypto").createHash("sha512").update(require("fs").readFileSync(process.argv[1])).digest("base64")' "$t")
            # The registry shows a fresh version late at times (v0.1.11: over two minutes for two
            # packages, with the publish itself done): wait up to ten minutes before calling it wrong.
            for i in $(seq 1 30); do
              got=$(npm view "$p@$V" dist.integrity 2>/dev/null || true)
              [ "$got" = "$want" ] && break
              [ "$i" = 30 ] && { echo "::error title=$p integrity::registry has '$got', tarball is $want"; exit 1; }
              sleep 20
            done
            echo "ok $p@$V $got"
          done
