name: conformance
# Pushes to main and pull requests only: a tag push (v0.1.0, go/v0.1.0) points at a commit main
# already ran, and triggering on it only duplicated every run (and every failure mail).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Its own job, so a missing secret or a hit never hides the test results of the other jobs.
  identity-strings:
    # GitHub holds only public, sanitised data (Owner rule, 2026-10-02): the private pattern list that
    # gates every export lives on the maintainer's machine and runs in release/publish.sh before any
    # push. This job only catches the generic shapes a slip would take: a home directory path, a
    # user-profile path, a private IP. It stores and prints nothing identifying.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (tag v7)
      - name: no home paths or private addresses
        run: |
          if git grep -nIE '(/home/[a-z][a-z0-9_-]*/|/Users/[A-Za-z][A-Za-z0-9_-]*/|C:\\Users\\|/root/\.|192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|fd[0-9a-f]{2}:)' -- . ':!*.md' ':!*test*' ':!*/testdata/*' | grep -vE 'example|placeholder|\$HOME|~/' ; then
            echo '::error title=home path or private address in tracked file::reword it; the full identity gate runs locally in release/publish.sh'; exit 1
          fi
          echo 'ok: no home paths or private addresses in tracked non-doc files'

  ts:
    runs-on: ubuntu-latest
    # `shell: bash` is `bash -eo pipefail`; the default is `bash -e`, without pipefail, so in run
    # 36923176793 `npm test | tee … || {annotate}` never saw npm's failure and spend failed this
    # job with no annotation (the matrix cells, which set it, annotated the same FAIL).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (tag v7)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (tag v7)
        with: { node-version: '22' }
      # Go too: the moadim adapter's test cross-checks its bundle with go/cmd/sigelo-verify,
      # and SKIPs that cross-check without `go` — here it must run, not skip.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (tag v7)
        with: { go-version: '1.27', cache-dependency-path: go/go.sum }
      - run: npm ci --ignore-scripts
        working-directory: ts
      - run: npx tsc
        working-directory: ts
      # public docs stay within their word budgets (docs-test/budgets.json)
      - run: node docs-test/check-budgets.mjs
      # vectors must be reproducible byte-for-byte from the documented seeds: the TypeScript
      # generator must reproduce the committed file exactly
      - run: node dist/gen_vectors.js > /tmp/ts-vectors.json && diff -u ../test-vectors.json /tmp/ts-vectors.json
        working-directory: ts
      # every vector, or nothing; failures as annotations (as for spend below)
      - run: |
          node dist/test.js 2>&1 | tee /tmp/ts-out || {
            { grep '^FAIL ' /tmp/ts-out | head -n 7; grep -E -m 3 'Error|^node:' /tmp/ts-out; tail -n 3 /tmp/ts-out; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=ts node dist\/test.js::/'; exit 1; }
          grep -q '^ALL PASS$' /tmp/ts-out
        working-directory: ts
      # `sigelo-verify --conformance --impl` (ROADMAP T7): the Go binary and ts/ (through its
      # wrapper) as candidates must both score ALL PASS, a deliberately broken wrapper must FAIL,
      # and docs-test/grade-verifier.mjs must print the same case lines as the binary
      - run: |
          (cd go && go build -o /tmp/sv ./cmd/sigelo-verify)
          /tmp/sv --conformance test-vectors.json --impl /tmp/sv > /tmp/impl-go; tail -3 /tmp/impl-go; grep -q '^ALL PASS$' /tmp/impl-go
          /tmp/sv --conformance test-vectors.json --impl /tmp/sv --impl-stdin | grep -q '^ALL PASS$'
          /tmp/sv --conformance test-vectors.json --impl 'node go/cmd/sigelo-verify/testdata/ts-candidate.mjs' > /tmp/impl-ts; tail -3 /tmp/impl-ts; grep -q '^ALL PASS$' /tmp/impl-ts
          if /tmp/sv --conformance test-vectors.json --impl 'node go/cmd/sigelo-verify/testdata/ts-candidate.mjs --break' > /tmp/impl-broken; then echo 'broken candidate passed'; exit 1; fi
          grep '^FAIL ' /tmp/impl-broken
          node docs-test/grade-verifier.mjs -- /tmp/sv > /tmp/grade-go
          diff <(grep -E '^(PASS|FAIL) ' /tmp/grade-go) <(grep -E '^(PASS|FAIL) ' /tmp/impl-go)
      # the moadim sidecar's full flow, against the freshly built library, re-verified by the
      # Go reference; the grep proves the cross-check ran rather than skipped
      - run: >-
          npm ci --ignore-scripts && npm test | tee /tmp/moadim-out && grep -q '^ALL PASS' /tmp/moadim-out && grep -q '^ok   go: same current DID$' /tmp/moadim-out
        working-directory: adapters/moadim
      # sigelo.io's world (world/test.mjs): challenge, attestation, refusals and rotation on a
      # random loopback port against the freshly built library, judged by the Go verifier (go
      # run; it FAILs, not skips, without go), plus the nginx allowlist for /world/. A few seconds.
      # Failures (FAIL lines, a crash's first Error/cause lines) as annotations, as for spend below.
      - run: |
          node world/test.mjs 2>&1 | tee /tmp/world-out || {
            { grep '^FAIL ' /tmp/world-out | head -n 7; grep -E -m 4 'Error|cause|^node:' /tmp/world-out; tail -n 3 /tmp/world-out; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=world node world\/test.mjs::/'; exit 1; }
          grep -q '^ALL PASS' /tmp/world-out && grep -q '^ok go sigelo-verify: ACCEPT' /tmp/world-out || {
            { grep '^FAIL ' /tmp/world-out | head -n 7; grep -E -m 4 'Error|cause|^node:' /tmp/world-out; tail -n 3 /tmp/world-out; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=world node world\/test.mjs::/'; exit 1; }
      # the Hermes pairing fixtures (adapters/hermes/pairing, SPEC §5.2 + §7 + §9): they must
      # regenerate byte for byte from the seeds, and both acceptors must run the whole set; the
      # Python one needs `cryptography` (a venv) and builds sigelo-verify with go. Seconds.
      - run: |
          node adapters/hermes/pairing/gen.mjs --check
          (cd accept/node && npm ci --ignore-scripts --omit=dev --silent)
          node adapters/hermes/pairing/test.mjs | tee /tmp/pairing-node && grep -q '^ALL PASS$' /tmp/pairing-node
          python3 -m venv /tmp/pyv && /tmp/pyv/bin/pip install -q --disable-pip-version-check cryptography
          /tmp/pyv/bin/python adapters/hermes/pairing/test.py | tee /tmp/pairing-py && grep -q '^ALL PASS$' /tmp/pairing-py
      # the bounded-spending service (MONERO.md §4). Same job, after `npx tsc` above: it
      # depends on `sigelo` as `file:../ts`, so it links dist/ and there must be a dist/ to link.
      # Its live-wallet section SKIPs on a runner with no monero-wallet-rpc on 127.0.0.1:38083.
      # A job's log needs a token to read, its annotations do not: on failure each FAIL line,
      # and the last lines (a crash prints no FAIL), become one ::error each.
      - run: |
          npm ci --ignore-scripts
          npm test 2>&1 | tee /tmp/spend-out || {
            { grep '^FAIL ' /tmp/spend-out | head -n 7; grep -E -m 3 'Error|^node:' /tmp/spend-out; tail -n 3 /tmp/spend-out; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=spend npm test::/'; exit 1; }
          grep -q '^ALL PASS$' /tmp/spend-out
        working-directory: spend

  # The same suites on every system the Owner targets (docs-test/PORTABILITY.md): Linux, macOS
  # (arm64) and Windows, Node 22 LTS and 24, plus current Node on Linux. bash on every runner
  # (Git Bash on Windows), and $RUNNER_TEMP instead of /tmp, because a Windows node does not see
  # Git Bash's /tmp. Nothing here needs a wallet: spend's live section and the monero-wallet-rpc
  # interop SKIP, as in the ts job.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        include:
          - { os: ubuntu-latest, node: 'current' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (tag v7)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (tag v7)
        with: { node-version: '${{ matrix.node }}' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (tag v7)
        with: { go-version: '1.27', cache-dependency-path: go/go.sum }
      # .gitattributes keeps every checkout LF; this proves it where it matters (Windows): no
      # tracked file is CRLF or mixed, in the index (i/) or in this checkout (w/). A file with no
      # line ending at all (i/none w/none: empty, or one line without a final newline) cannot
      # carry a CR and passes. The old form (anything but w/lf or w/-text fails) failed every
      # runner on 2026-10-01 over two `[]` results files without a final newline, and could not
      # see a CRLF committed to the index; crosscheck/run.sh now ends its results with LF.
      - run: "! git ls-files --eol | grep -E '^i/(crlf|mixed)|[[:space:]]w/(crlf|mixed)[[:space:]]'"
      - run: npm ci --ignore-scripts && npx tsc
        working-directory: ts
      - run: node dist/gen_vectors.js > "$RUNNER_TEMP/ts-vectors.json" && diff -u ../test-vectors.json "$RUNNER_TEMP/ts-vectors.json"
        working-directory: ts
      # failures as annotations, as in the ts job (run 36923176793 failed this step on macOS with none)
      - run: |
          node dist/test.js 2>&1 | tee "$RUNNER_TEMP/ts-out" || {
            { grep '^FAIL ' "$RUNNER_TEMP/ts-out" | head -n 7; grep -E -m 3 'Error|^node:' "$RUNNER_TEMP/ts-out"; tail -n 3 "$RUNNER_TEMP/ts-out"; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=ts node dist\/test.js::/'; exit 1; }
          grep -q '^ALL PASS$' "$RUNNER_TEMP/ts-out"
        working-directory: ts
      - run: >-
          npm ci --ignore-scripts && npm test | tee "$RUNNER_TEMP/moadim-out" && grep -q '^ALL PASS' "$RUNNER_TEMP/moadim-out" && grep -q '^ok   go: same current DID$' "$RUNNER_TEMP/moadim-out"
        working-directory: adapters/moadim
      # OS-neutral: a random loopback port, `go run` for the judge, `sh` (Git Bash on Windows) for the allowlist
      - run: |
          node world/test.mjs 2>&1 | tee "$RUNNER_TEMP/world-out" || {
            { grep '^FAIL ' "$RUNNER_TEMP/world-out" | head -n 7; grep -E -m 4 'Error|cause|^node:' "$RUNNER_TEMP/world-out"; tail -n 3 "$RUNNER_TEMP/world-out"; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=world node world\/test.mjs::/'; exit 1; }
          grep -q '^ALL PASS' "$RUNNER_TEMP/world-out" && grep -q '^ok go sigelo-verify: ACCEPT' "$RUNNER_TEMP/world-out" || {
            { grep '^FAIL ' "$RUNNER_TEMP/world-out" | head -n 7; grep -E -m 4 'Error|cause|^node:' "$RUNNER_TEMP/world-out"; tail -n 3 "$RUNNER_TEMP/world-out"; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=world node world\/test.mjs::/'; exit 1; }
      # failures as annotations, as in the ts job
      - run: |
          npm ci --ignore-scripts
          npm test 2>&1 | tee "$RUNNER_TEMP/spend-out" || {
            { grep '^FAIL ' "$RUNNER_TEMP/spend-out" | head -n 7; grep -E -m 3 'Error|^node:' "$RUNNER_TEMP/spend-out"; tail -n 3 "$RUNNER_TEMP/spend-out"; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=spend npm test::/'; exit 1; }
          grep -q '^ALL PASS$' "$RUNNER_TEMP/spend-out"
        working-directory: spend
      - run: npm test
        working-directory: integrations/mcp
      - run: node schema/check.mjs | tee "$RUNNER_TEMP/schema-out" && grep -q '^ALL PASS$' "$RUNNER_TEMP/schema-out"
      - run: go vet ./... && go test ./... -v | tee "$RUNNER_TEMP/go-out" && grep -q '^ALL PASS$' "$RUNNER_TEMP/go-out"
        working-directory: go

  # The reference verifier.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (tag v7)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (tag v7)
        with: { go-version: '1.27', cache-dependency-path: go/go.sum }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: go
      - run: go vet ./...
        working-directory: go
      # every vector, the monero vectors and the 1f916 adapter's emitted bundle
      # (adapters/1f916/sample-bundle.json must be ACCEPTED): same conformance target as ts/
      - run: go test ./... -v | tee /tmp/go-out && grep -q '^ALL PASS$' /tmp/go-out
        working-directory: go
      - run: CGO_ENABLED=0 go build ./cmd/sigelo-verify
        working-directory: go
      # the static binary, as a user runs it, must reproduce the `bundle` vector's §9.1 result
      - run: |
          node -e 'const v = require("../test-vectors.json").vectors.bundle; require("fs").writeFileSync("/tmp/go-bundle.json", JSON.stringify(v.bundle)); console.log(v.now)' > /tmp/go-now
          ./sigelo-verify /tmp/go-bundle.json --now "$(cat /tmp/go-now)" > /tmp/go-result.json
          node -e 'const a = require("/tmp/go-result.json"), e = require("../test-vectors.json").vectors.bundle.expect; require("assert").deepStrictEqual(a, e)'
        working-directory: go
      # `sigelo-verify --conformance`: the vectors run from the binary, the same lines as
      # `go test` (both call go/conformance.go), and the Monero section must run, not SKIP
      - run: |
          ./sigelo-verify --conformance ../test-vectors.json | tee /tmp/conf-out
          grep -q '^ALL PASS$' /tmp/conf-out && ! grep -q '^SKIP' /tmp/conf-out
          ./sigelo-verify --version
        working-directory: go
      # schema/*.json (JSON Schema 2020-12) against the vectors: positives validate, structural
      # negatives do not, parity bundles split fatal/per-item as the verifiers do
      - run: node schema/check.mjs | tee /tmp/schema-out && grep -q '^ALL PASS$' /tmp/schema-out
      # spend/openapi.yaml names exactly the routes spend/service.ts serves
      - run: |
          node -e '
            const fs = require("fs");
            const code = [...fs.readFileSync("spend/service.ts", "utf8").matchAll(/["\x27](GET|POST) (\/[a-z]+)["\x27]/g)].map((m) => `${m[1]} ${m[2]}`);
            const api = [...fs.readFileSync("spend/openapi.yaml", "utf8").matchAll(/^  (\/[a-z]+):\n    (get|post):/gm)].map((m) => `${m[2].toUpperCase()} ${m[1]}`);
            const a = [...new Set(code)].sort(), b = [...new Set(api)].sort();
            console.log(`service.ts ${a.length} routes, openapi.yaml ${b.length}`);
            require("assert").deepStrictEqual(b, a);
          '

  # Reproducible release (ROADMAP §5.5, T4): five sigelo-verify targets, the source archive and
  # the four npm tarballs, built twice, the second time with an empty Go build cache and npm
  # cache, and the two SHA256SUMS must be identical; then release/pack-test.sh installs the
  # tarballs in an empty directory and runs them. Uploaded as an artifact for a second builder
  # to compare against; nothing is published.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (tag v7)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (tag v7)
        with: { node-version: '22' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (tag v7)
        with: { go-version: '1.27', cache-dependency-path: go/go.sum }
      - run: release/build.sh /tmp/rel1
      - run: GOCACHE=/tmp/gocache2 npm_config_cache=/tmp/npmcache2 release/build.sh /tmp/rel2 && diff /tmp/rel1/SHA256SUMS /tmp/rel2/SHA256SUMS
      # failures as annotations (the log is not public): pack-test's FAIL line and what it printed last
      - run: |
          release/pack-test.sh /tmp/rel1 2>&1 | tee /tmp/pack-test-out || {
            { grep '^FAIL ' /tmp/pack-test-out | head -n 3; tail -n 5 /tmp/pack-test-out; } | grep . | cut -c1-900 | sed 's/%/%25/g; s/^/::error title=release pack-test::/'; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (tag v7)
        with:
          name: sigelo-verify-SHA256SUMS
          path: /tmp/rel1/SHA256SUMS
