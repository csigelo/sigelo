Builds:
  - versionName: 0.1.10
    versionCode: 2
    commit: v0.1.10
    subdir: apps/android/app
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - cd /tmp
      - N=node-v24.18.1-linux-x64.tar.xz
      - H=d6c664df3f3f61458e8c277585571328522d705166723a7c7823a9253a4d15a0
      - curl -fsSLO https://nodejs.org/dist/v24.18.1/$N
      - echo "$H  $N" | sha256sum -c -
      - tar -xJf $N -C /usr/local --strip-components=1
      - rm $N
    gradle:
      - yes
    prebuild:
      - cd ../../../ts
      - npm ci --ignore-scripts
      - cd ../contact
      - npm ci --ignore-scripts
    build:
      - cd ../../../ts
      - npx tsc
      - cd ..
      - node apps/android/assets.mjs

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
